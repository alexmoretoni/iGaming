version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: igame
      POSTGRES_PASSWORD: igame
      POSTGRES_DB: igame_k5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  clickhouse:
    image: clickhouse/clickhouse-server:24.6
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse

volumes:
  postgres_data:
  clickhouse_data:
